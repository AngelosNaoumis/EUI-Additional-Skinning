name: Checks

# Same command as local: python tests/run.py (lint, Lua 5.1 compile, specs), plus the specs on
# Lua 5.4 and the package build. CLAUDE.md lists the rules the lint enforces.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lupa (Lua 5.1 and 5.4)
        run: python -m pip install --quiet lupa
      - name: Lint, compile on Lua 5.1, specs on Lua 5.1
        run: python tests/run.py
      - name: Specs on Lua 5.4
        run: python tests/run.py --lua 5.4
      - name: Package
        run: python scripts/package.py --out dist
